<!DOCTYPE html>
<html>

    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='main.css'>
    <script src='main.js'></script>
</head>
<body>

        <h1 id="top"></h1>

        <div id="topic"></div>
        <hr>
        <div id="reply1"></div>

        <br/>
        <div class="button-group">

        </div>
    </div>
</body>
</html>
